id = "herdr-orchestrator"
name = "Orchestrator"
version = "0.6.2"
min_herdr_version = "0.9.3"
description = "Persistent user-acknowledged FIFO, worker receipts and a polling coordinator wake-up."
platforms = ["linux", "macos"]

[[build]]
command = ["python3", "orchestrator.py", "check-runtime"]

[[startup]]
command = ["python3", "orchestrator.py", "startup"]

[[actions]]
id = "start"
title = "启动 / 恢复总控"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "start"]

[[actions]]
id = "switch"
title = "更换总控为当前 Agent"
contexts = ["pane"]
command = ["python3", "orchestrator.py", "action", "switch"]

[[actions]]
id = "focus"
title = "定位总控"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "focus"]

[[actions]]
id = "continue"
title = "当前结果已处理完"
contexts = ["pane"]
command = ["python3", "orchestrator.py", "action", "continue"]

[[actions]]
id = "archive"
title = "归档面板所选任务"
contexts = ["pane"]
command = ["python3", "orchestrator.py", "action", "archive"]

[[actions]]
id = "install-shortcuts"
title = "安装推荐面板键"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "install-shortcuts"]

[[actions]]
id = "stop"
title = "暂停自动提醒"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "stop"]

[[actions]]
id = "status"
title = "总控任务面板"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "status"]

[[panes]]
id = "status"
title = "总控任务面板"
placement = "popup"
width = "85%"
height = "80%"
command = ["python3", "orchestrator.py", "board"]
