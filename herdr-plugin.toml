id = "herdr-orchestrator"
name = "Orchestrator"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Persistent user-acknowledged FIFO, worker receipts and a polling coordinator wake-up."
platforms = ["linux", "macos"]

[[build]]
command = ["python3", "orchestrator.py", "check-runtime"]

[[startup]]
command = ["python3", "orchestrator.py", "startup"]

[[actions]]
id = "start"
title = "Orchestrator: start or resume the coordinator"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "start"]

[[actions]]
id = "switch"
title = "Orchestrator: switch coordinator to this agent"
contexts = ["pane"]
command = ["python3", "orchestrator.py", "action", "switch"]

[[actions]]
id = "focus"
title = "Orchestrator: focus the bound coordinator"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "focus"]

[[actions]]
id = "continue"
title = "Orchestrator: current report handled, continue to the next"
contexts = ["pane"]
command = ["python3", "orchestrator.py", "action", "continue"]

[[actions]]
id = "install-shortcuts"
title = "Orchestrator: install recommended shortcuts"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "install-shortcuts"]

[[actions]]
id = "stop"
title = "Orchestrator: pause coordination"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "stop"]

[[actions]]
id = "status"
title = "Orchestrator: status and pending reports"
contexts = ["global", "pane", "workspace"]
command = ["python3", "orchestrator.py", "action", "status"]

[[panes]]
id = "status"
title = "Orchestrator"
placement = "popup"
width = "85%"
height = "80%"
command = ["python3", "orchestrator.py", "board"]
